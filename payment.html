<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ชำระเงิน</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .container {
      max-width: 400px;
      margin: 60px auto 0 auto;
      background: #fff;
      padding: 36px 28px 28px 28px;
      border-radius: 14px;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,.08);
      text-align: center;
    }
    h1 {
      color: #2979ff;
      margin-bottom: 16px;
      font-size: 2rem;
    }
    form {
      margin-top: 16px;
    }
    label {
      display: block;
      color: #4a4a4a;
      margin-bottom: 8px;
      text-align: left;
      font-size: 1rem;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bbb;
      border-radius: 7px;
      margin-bottom: 18px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .pay-btn {
      padding: 12px 32px;
      background: #2979ff;
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      font-weight: 600;
      transition: background 0.18s;
    }
    .pay-btn:hover {
      background: #1565c0;
    }
    .success {
      color: #43a047;
      margin-top: 18px;
      display: none;
      font-size: 1.08rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ชำระเงิน</h1>
    <form id="paymentForm" autocomplete="off">
      <label for="name">ชื่อผู้ชำระเงิน</label>
      <input type="text" id="name" name="name" placeholder="กรอกชื่อของคุณ" required />

      <label for="amount">จำนวนเงิน (บาท)</label>
      <input type="number" id="amount" name="amount" placeholder="เช่น 500" min="1" step="1" required />

      <button type="submit" class="pay-btn">ชำระเงิน</button>
    </form>
    <div class="success" id="successMsg">ชำระเงินสำเร็จ! ขอบคุณค่ะ</div>
  </div>
  <script>
    const paymentForm = document.getElementById('paymentForm');
    const successMsg = document.getElementById('successMsg');

    paymentForm.addEventListener('submit', function(e) {
      e.preventDefault();
      successMsg.style.display = 'block';
      paymentForm.reset();
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 2500);
    });
  </script>
</body>
</html>
