<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ยินดีต้อนรับ</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: 60px auto 0 auto;
      background: #fff;
      padding: 40px 32px 32px 32px;
      border-radius: 16px;
      box-shadow: 0 2px 16px 0 rgba(0,0,0,.05);
      text-align: center;
    }
    h1 {
      color: #2979ff;
      margin-bottom: 8px;
      font-size: 2.2rem;
    }
    p {
      color: #4a4a4a;
      font-size: 1.15rem;
    }
    .cta-button {
      padding: 12px 36px;
      background: #2979ff;
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 28px;
      font-weight: 600;
      transition: background 0.18s;
    }
    .cta-button:hover {
      background: #1565c0;
    }
    footer {
      color: #aaa;
      font-size: .98rem;
      text-align: center;
      margin: 32px 0 0 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ยินดีต้อนรับ!</h1>
    <p>นี่คือหน้า Landing Page ของคุณ<br />เริ่มต้นใช้งานเว็บไซต์ได้ที่นี่</p>
    <button class="cta-button" onclick="alert('ขอบคุณที่เยี่ยมชม!')">เริ่มต้นใช้งาน</button>
  </div>
  <footer>
    &copy; 2024 เว็บไซต์ของคุณ
  </footer>
</body>
</html>
